workflows:
  ios-release:
    name: iOS Release Build
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter packages pub get
      - name: Install CocoaPods
        script: |
          cd ios && pod install && cd ..
      - name: Build and Package Unsigned IPA
        script: |
          set -e
          # 1. Build Xcode archive without signing
          xcodebuild -workspace ios/Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/ios/Runner.xcarchive \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     archive

          # 2. Package into IPA format
          mkdir -p build/Payload
          cp -R build/ios/Runner.xcarchive/Products/Applications/Runner.app build/Payload/
          cd build
          zip -r -y sala_app_unsigned.ipa Payload
          cd ..
          mv build/sala_app_unsigned.ipa ./sala_app_unsigned.ipa
    artifacts:
      - sala_app_unsigned.ipa
    publishing:
      email:
        recipients:
          - zaidbelal222@gmail.com
        notify:
          success: true
          failure: true
