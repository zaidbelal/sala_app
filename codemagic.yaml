workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Disable Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Get Flutter Packages
        script: |
          # التأكد من التواجد في المجلد الرئيسي للمشروع
          cd $CM_BUILD_DIR
          flutter pub get
      - name: Clean Pods and Install
        script: |
          cd $CM_BUILD_DIR/ios
          rm -rf Pods Podfile.lock
          pod install
      - name: Build iOS IPA
        script: |
          cd $CM_BUILD_DIR
          flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa