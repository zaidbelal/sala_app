name: Build Unsigned iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure and Enable iOS Platform
        run: |
          # نقل مجلد ios إلى الجذر إذا كان بالخطأ داخل macos
          if [ -d "macos/ios" ] && [ ! -d "ios" ]; then
            mv macos/ios ios
          fi
          
          # تهيئة إعدادات منصة iOS الرسمية في Flutter
          flutter config --enable-ios
          flutter create --platforms=ios .

      - name: Install Pods & Dependencies
        run: |
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r sala_app_unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sala-app-ios
          path: sala_app_unsigned.ipa
