name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate iOS Platform Cleanly
        run: |
          rm -rf ios macos/ios
          flutter config --no-enable-swift-package-manager
          flutter create --platforms=ios --org com.salaapp .
          
          # كتابة platform 15.0 في بداية Podfile بشكل قطعي
          echo "platform :ios, '15.0'" > ios/Podfile.new
          cat ios/Podfile >> ios/Podfile.new
          mv ios/Podfile.new ios/Podfile

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Application
        run: flutter build ios --release --no-codesign

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -q app-release.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sala-app-release
          path: app-release.ipa
