name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Force Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate iOS Platform Cleanly
        run: |
          rm -rf ios
          flutter config --no-enable-swift-package-manager
          flutter create --platforms=ios --org com.salaapp .
          sed -i '' "s/# platform :ios, '.*'/platform :ios, '14.0'/g" ios/Podfile
          sed -i '' "s/platform :ios, '.*'/platform :ios, '14.0'/g" ios/Podfile

      - name: Install Dependencies
        run: flutter pub get

      - name: Install Pods & Fix Firebase
        run: |
          cd ios
          pod install --repo-update
          find Pods -name "FirebaseDataEncoder.swift" -exec sed -i '' 's/sending //g' {} +
          cd ..

      - name: Build iOS Application
        run: flutter build ios --release --no-codesign

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -q app-release.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sala-app-release
          path: app-release.ipa
